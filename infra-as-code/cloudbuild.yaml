# Cloud Build pipeline for executing Terraform infrastructure-as-code.
#
# Target Directory: cicd/terraform
#
# This pipeline runs `terraform init` followed by the specified action
# (`plan` or `apply`). All backend state configuration and variables
# can be injected via Cloud Build substitutions.

steps:
  # 1. Initialize Terraform backend
  - id: tf-init
    name: 'hashicorp/terraform:1.14'
    dir: 'infra-as-code/terraform'
    args:
      - 'init'
      - '-backend-config=bucket=${_TF_STATE_BUCKET}'
      - '-backend-config=prefix=${_TF_STATE_PREFIX}'
    env:
      - 'TF_IN_AUTOMATION=true'

  # 2. Execute Terraform action (plan/apply/destroy)
  - id: tf-action
    name: 'hashicorp/terraform:1.14'
    entrypoint: 'sh'
    dir: 'infra-as-code/terraform'
    args:
      - '-c'
      - |
        if [ "${_TF_ACTION}" = "apply" ] || [ "${_TF_ACTION}" = "plan" ]; then
          terraform import google_artifact_registry_repository.bench "projects/${_BUILD_PROJECT_ID}/locations/${_REGION}/repositories/${_AR_REPO}" 2>/dev/null || true
        fi

        if [ "${_TF_ACTION}" = "plan" ]; then
          terraform plan -no-color -input=false
        else
          terraform "${_TF_ACTION}" -auto-approve -no-color -input=false
        fi
    env:
      - 'TF_IN_AUTOMATION=true'
      - 'TF_VAR_orchestration_project_id=${_ORCH_PROJECT_ID}'
      - 'TF_VAR_orchestration_region=${_REGION}'
      - 'TF_VAR_build_project_id=${_BUILD_PROJECT_ID}'
      - 'TF_VAR_build_region=${_REGION}'
      - 'TF_VAR_runtime_project_id=${_RUNTIME_PROJECT_ID}'
      - 'TF_VAR_runtime_region=${_REGION}'
      - 'TF_VAR_builder_sa_email=${_BUILDER_SA_EMAIL}'
      - 'TF_VAR_runtime_sa_email=${_RUNTIME_SA_EMAIL}'
      - 'TF_VAR_ar_repo=${_AR_REPO}'
      - 'TF_VAR_vms=${_VMS_JSON}'

substitutions:
  _TF_ACTION: 'apply'
  _TF_STATE_BUCKET: ''
  _TF_STATE_PREFIX: 'lighter-prover'
  _REGION: 'us-central1'
  _ORCH_PROJECT_ID: ''
  _BUILD_PROJECT_ID: ''
  _RUNTIME_PROJECT_ID: ''
  _BUILDER_SA_EMAIL: ''
  _RUNTIME_SA_EMAIL: ''
  _AR_REPO: 'lighter-prover'
  _VMS_JSON: '{}'

options:
  logging: CLOUD_LOGGING_ONLY

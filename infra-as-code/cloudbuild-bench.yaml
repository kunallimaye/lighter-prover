steps:
  # 0. Noop to satisfy unused vars validation
  - id: noop-unused-vars
    name: 'alpine:latest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Unused vars to satisfy Cloud Build validation:"
        echo "TF_ACTION=${_TF_ACTION}"
        echo "TF_STATE_BUCKET=${_TF_STATE_BUCKET}"
        echo "TF_STATE_PREFIX=${_TF_STATE_PREFIX}"
        echo "RUNTIME_PROJECT_ID=${_RUNTIME_PROJECT_ID}"
        echo "BUILD_PROJECT_ID=${_BUILD_PROJECT_ID}"
        echo "BUILDER_SA_EMAIL=${_BUILDER_SA_EMAIL}"
        echo "RUNTIME_SA_EMAIL=${_RUNTIME_SA_EMAIL}"
        echo "ORCH_PROJECT_ID=${_ORCH_PROJECT_ID}"
        echo "AR_REPO=${_AR_REPO}"
        echo "BENCHMARK_ID=${_BENCHMARK_ID}"
        echo "BENCHMARK_BUCKET=${_BENCHMARK_BUCKET}"
        echo "CHUNK_SIZE=${_CHUNK_SIZE}"
        echo "POOL_TOPOLOGY=${_POOL_TOPOLOGY}"

  # 1. Dynamic Deployment Spec Rendering
  - id: k8s-render
    name: 'python:3.11-slim'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          echo "[INFO] Rendering dynamic K8s deployment manifests reading config.toml..."
          python3 infra-as-code/scripts/render_pod_spec.py \
            --arch="${_ARCH}" \
            --blocks="${_BLOCK_CONCURRENCY}" \
            --image="${_IMAGE}" \
            --radix="${_RADIX}" \
            --chunk="${_CHUNK_SIZE}" \
            --benchmark-id="${_BENCHMARK_ID}" \
            --fold-strategy="${_FOLD_STRATEGY}" \
            --pool-topology="${_POOL_TOPOLOGY}" \
            --emit-fungible \
            --baseload=10 \
            --burst=0 \
            --topic="${_WORK_TOPIC}" \
            --subscription="${_WORK_SUBSCRIPTION}" \
            --event-topic="${_EVENT_TOPIC}" \
            --event-subscription="${_EVENT_SUBSCRIPTION}"
        fi

  # 1.5 Clean old GKE resources and wait for full termination to avoid race conditions
  - id: delete-old-gke-resources
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          PROJECT_ID="${_RUNTIME_PROJECT_ID:-${_BUILD_PROJECT_ID}}"
          gcloud container clusters get-credentials lighter-prover-cluster-${_ARCH} --zone=${_REGION}-b --project=$${PROJECT_ID}
          
          echo "[INFO] Cleaning old GKE resources (both topologies: unified + split)..."
          # Delete BOTH possible worker sets so switching topology between runs is
          # clean: unified emits `lighter-fungible-prover`; split emits
          # `lighter-fungible-leaf` + `lighter-fungible-agg`. --ignore-not-found
          # makes deleting the absent set a no-op.
          # (#363) Fold dispatch is DECENTRALIZED (workers self-gate via GCS CAS);
          # the central dispatch coordinator daemon + Redis are RETIRED. We STILL
          # delete `deployment/lighter-active-coordinator`, `deployment/lighter-redis`
          # and `service/redis-service` here so a cluster left over from a
          # pre-#363 run is cleaned up (idempotent via --ignore-not-found), but we
          # no longer DEPLOY them. `job/lighter-coordinator` is the KEPT
          # RootCoordinator HARVESTER (proof verification), cleaned for a fresh run.
          kubectl delete \
            deployment/lighter-fungible-prover \
            deployment/lighter-fungible-leaf \
            deployment/lighter-fungible-agg \
            scaledobject.keda.sh/lighter-fungible-prover \
            scaledobject.keda.sh/lighter-fungible-leaf \
            scaledobject.keda.sh/lighter-fungible-agg \
            deployment/lighter-active-coordinator deployment/lighter-redis service/redis-service job/lighter-seeder job/lighter-coordinator \
            --ignore-not-found=true || true
        fi

  # 2. Clean GCS bucket before run to avoid stale proofs
  - id: clean-gcs
    name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          echo "[INFO] Cleaning GCS stark_proofs directory..."
          gsutil -m rm -rf "gs://${_TF_STATE_BUCKET}/benchmark-reports/${_BENCHMARK_ID}/${_IMAGE}/${_ARCH}/stark_proofs/*" || true
          # (#347) Also clear the durable per-pod events/ prefix so this run's
          # telemetry is not polluted by stale events from a prior run under the
          # same benchmark-id (each event is uniquely keyed, so old objects would
          # otherwise accumulate and be re-counted by the extractor).
          echo "[INFO] Cleaning GCS events directory (#347 durable telemetry)..."
          gsutil -m rm -rf "gs://${_TF_STATE_BUCKET}/benchmark-reports/${_BENCHMARK_ID}/${_IMAGE}/${_ARCH}/events/*" || true
        fi

  # 2.5 Clean Pub/Sub subscriptions to avoid stale tasks/events
  - id: clean-pubsub
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          echo "[INFO] Purging Pub/Sub subscriptions..."
          # Seek to 10 seconds in the past to discard all old unacked messages safely without purging new ones
          PURGE_TIME=$(date -u -d "-10 seconds" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-10s +%Y-%m-%dT%H:%M:%SZ)
          # Purge all three work subs (split: leaf+agg; unified: unified) + events.
          # A sub that doesn't exist yet (e.g. unified_sub not yet applied) is
          # tolerated via `|| true` so the step never blocks the run.
          gcloud pubsub subscriptions seek "prover-leaf-work-sub" --time="$${PURGE_TIME}" --project="${_RUNTIME_PROJECT_ID:-${_BUILD_PROJECT_ID}}" || true
          gcloud pubsub subscriptions seek "prover-agg-work-sub" --time="$${PURGE_TIME}" --project="${_RUNTIME_PROJECT_ID:-${_BUILD_PROJECT_ID}}" || true
          gcloud pubsub subscriptions seek "prover-unified-work-sub" --time="$${PURGE_TIME}" --project="${_RUNTIME_PROJECT_ID:-${_BUILD_PROJECT_ID}}" || true
          gcloud pubsub subscriptions seek "${_EVENT_SUBSCRIPTION}" --time="$${PURGE_TIME}" --project="${_RUNTIME_PROJECT_ID:-${_BUILD_PROJECT_ID}}" || true
        fi

  # 3. Deploy GKE Proving Pipeline (Fungible Pool)
  - id: deploy-pipeline
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          PROJECT_ID="${_RUNTIME_PROJECT_ID:-${_BUILD_PROJECT_ID}}"
          gcloud container clusters get-credentials lighter-prover-cluster-${_ARCH} --zone=${_REGION}-b --project=$${PROJECT_ID}
          
          # (#363) DECENTRALIZED fold dispatch: Redis + the central dispatch
          # coordinator daemon (`lighter-active-coordinator`) are RETIRED — workers
          # perform readiness gating themselves via GCS CAS
          # (PubSubGcsTransport::commit_and_gate). The renderer no longer emits the
          # `-redis`/`-active-coordinator` manifests, so those apply steps are
          # removed. The RootCoordinator HARVESTER (`lighter-coordinator` Job,
          # deployed below) still gates run completion.
          echo "[INFO] Deploying Fungible Workers (topology=${_POOL_TOPOLOGY})..."
          # The renderer always writes the worker Deployment(s) to
          # prover_pod_unit-fungible.rendered.yaml regardless of topology, so this
          # apply is topology-agnostic. If a KEDA file was rendered separately
          # (unified path), apply it too (ignored if absent).
          kubectl apply -f infra-as-code/kubernetes/prover_pod_unit-fungible.rendered.yaml
          if [ -f infra-as-code/kubernetes/prover_pod_unit-fungible-keda.rendered.yaml ]; then
            kubectl apply -f infra-as-code/kubernetes/prover_pod_unit-fungible-keda.rendered.yaml || true
          fi

          echo "[INFO] Waiting for all provers to be ready and prewarmed..."
          # Wait on whichever Deployment(s) the chosen topology rendered: unified
          # -> lighter-fungible-prover; split -> lighter-fungible-leaf + -agg.
          # `kubectl get` gates each rollout so the absent set is skipped cleanly.
          if kubectl get deployment/lighter-fungible-prover >/dev/null 2>&1; then
            kubectl rollout status deployment/lighter-fungible-prover --timeout=400s
          fi
          if kubectl get deployment/lighter-fungible-leaf >/dev/null 2>&1; then
            kubectl rollout status deployment/lighter-fungible-leaf --timeout=400s
          fi
          if kubectl get deployment/lighter-fungible-agg >/dev/null 2>&1; then
            kubectl rollout status deployment/lighter-fungible-agg --timeout=400s
          fi
          
          echo "[INFO] Cleaning prior Seeder and Coordinator jobs..."
          kubectl delete job/lighter-seeder job/lighter-coordinator --ignore-not-found=true
          
          echo "[INFO] Deploying Seeder (Bootstrapping Queue)..."
          kubectl apply -f infra-as-code/kubernetes/prover_pod_unit-seeder.rendered.yaml
          
          # (#363) The `lighter-coordinator` Job is the RootCoordinator HARVESTER
          # (waits for the root proof, then verifies it) — NOT the retired dispatch
          # daemon. With worker-side gating driving the tree to root, the harvester
          # completing IS the run-completion signal. KEPT.
          echo "[INFO] Deploying RootCoordinator harvester (lighter-coordinator Job)..."
          kubectl apply -f infra-as-code/kubernetes/prover_pod_unit-coordinator.rendered.yaml
          
          echo "[INFO] Waiting for pipeline completion (waiting on RootCoordinator harvester)..."
          kubectl wait --for=condition=complete job/lighter-coordinator --timeout=1200s || WORKLOAD_FAILED=true
          
          # Best-effort harvester log grab (a FALLBACK telemetry source). The
          # PRIMARY source is the durable per-pod events/ prefix in GCS (#347),
          # which survives even when these logs are unavailable — so a failure here
          # is NON-FATAL and must never abort the build before telemetry runs.
          # (#363) The retired dispatch daemon (`lighter-active-coordinator`) is no
          # longer deployed, so its log grab is removed; only the harvester Job's
          # log remains.
          echo "[INFO] Extracting RootCoordinator harvester logs (best-effort fallback source)..."
          kubectl logs job/lighter-coordinator -c coordinator > coordinator.log 2>/dev/null || true
          
          # (#347) DO NOT `exit 1` here on workload failure: that aborted the whole
          # build and the telemetry+upload step never ran (attempt-57 lost its
          # throughput number this way). Instead persist a marker so the telemetry
          # step ALWAYS runs (the events are durable in GCS regardless), uploads
          # the summary, and only THEN re-surfaces the failure as the build status.
          if [ "$${WORKLOAD_FAILED}" = "true" ]; then
            echo "[WARNING] Coordinator Job failed or timed out. Proceeding to durable telemetry extraction (events are in GCS); the build will be marked failed AFTER upload."
            echo "true" > workload_failed.marker
          fi
        fi

  # 7. Extract GKE Telemetry & Upload bench_summary.json.
  #    (#347) PREFERS the durable per-pod events/ GCS prefix (decoupled from
  #    coordinator stdout / this pipeline step / cluster lifetime) and falls back
  #    to coordinator.log. Runs + uploads even when the workload failed, so the
  #    throughput number is never lost to a downstream failure.
  - id: gke-telemetry
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          set +e  # never let a single command abort before the upload runs
          PROJECT_ID="${_RUNTIME_PROJECT_ID:-${_BUILD_PROJECT_ID}}"
          BUCKET="${_TF_STATE_BUCKET}"
          DEST_PREFIX="gs://$${BUCKET}/benchmark-reports/${_BENCHMARK_ID}/${_IMAGE}/${_ARCH}"
          EVENTS_PREFIX="$${DEST_PREFIX}/events/"

          # Coordinator-log fallback only needs cluster creds; the events-GCS
          # primary source does not. Grab creds best-effort (the cluster may be
          # gone — the events are still in GCS).
          gcloud container clusters get-credentials lighter-prover-cluster-${_ARCH} --zone=${_REGION}-b --project=$${PROJECT_ID} || true

          COORD_ARG=""
          if [ -s coordinator.log ]; then
            COORD_ARG="--coordinator-log=coordinator.log"
          fi

          echo "[INFO] Extracting telemetry (PRIMARY: durable events-GCS $${EVENTS_PREFIX}; FALLBACK: coordinator.log)..."
          python3 infra-as-code/scripts/extract_gke_telemetry.py \
            --arch="${_ARCH}" \
            --events-gcs-prefix="$${EVENTS_PREFIX}" \
            $${COORD_ARG} \
            --config=config.toml \
            --benchmark-id="${_BENCHMARK_ID}" \
            --image="${_IMAGE}" \
            --no-upload \
            --out=bench_summary.json || echo "[WARNING] extractor returned non-zero; uploading whatever was produced."

          # ALWAYS upload the summary + coordinator.log (if any), even when the
          # workload failed — the durable artifacts must land regardless (#347).
          if [ -f bench_summary.json ]; then
            echo "[INFO] Uploading bench_summary.json -> $${DEST_PREFIX}/bench_summary.json"
            gcloud storage cp bench_summary.json "$${DEST_PREFIX}/bench_summary.json" || echo "[WARNING] bench_summary.json upload failed."
          else
            echo "[WARNING] No bench_summary.json produced; nothing to upload."
          fi
          if [ -s coordinator.log ]; then
            echo "[INFO] Uploading coordinator.log -> $${DEST_PREFIX}/coordinator.log"
            gcloud storage cp coordinator.log "$${DEST_PREFIX}/coordinator.log" || echo "[WARNING] coordinator.log upload failed."
          fi

          # Re-surface a workload failure AFTER the durable upload so the build
          # status is honest but the telemetry is never lost.
          if [ -f workload_failed.marker ]; then
            echo "[ERROR] Coordinator Job had failed/timed out; telemetry uploaded to $${DEST_PREFIX} regardless. Failing the build now."
            exit 1
          fi
        fi

substitutions:
  _ENGINE: 'gke'
  _ARCH: 'c3d'
  _RADIX: '16'
  # #321 Phase 8: reduction is the DEFAULT fold strategy on GKE; 'hex' opts out.
  _FOLD_STRATEGY: 'reduction'
  # #321 fungible worker-pool topology: 'split' (default; two fixed leaf/agg
  # Deployments — zero behavior change) or 'unified' (one self-balancing
  # `lighter-fungible-prover` Deployment on prover-unified-work-sub). Opt in via
  # POOL_TOPOLOGY=unified make cloud-gke-bench ...
  _POOL_TOPOLOGY: 'split'
  _CHUNK_SIZE: '1'
  _BLOCK_CONCURRENCY: '10'
  _REGION: 'us-east4'
  _BUILD_PROJECT_ID: ''
  _RUNTIME_PROJECT_ID: ''
  _BENCHMARK_ID: ''
  _IMAGE: 'latest'
  _BENCHMARK_BUCKET: ''
  _TF_ACTION: 'apply'
  _TF_STATE_BUCKET: ''
  _TF_STATE_PREFIX: ''
  _AR_REPO: ''
  _ORCH_PROJECT_ID: ''
  _BUILDER_SA_EMAIL: ''
  _RUNTIME_SA_EMAIL: ''
  _WORK_TOPIC: 'prover-work-topic'
  _WORK_SUBSCRIPTION: 'prover-work-sub'
  _EVENT_TOPIC: 'prover-events-topic'
  _EVENT_SUBSCRIPTION: 'prover-events-sub'

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s

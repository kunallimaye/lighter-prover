steps:
  # 0. Noop to satisfy unused vars validation
  - id: noop-unused-vars
    name: 'alpine:latest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Unused vars to satisfy Cloud Build validation:"
        echo "TF_ACTION=${_TF_ACTION}"
        echo "TF_STATE_BUCKET=${_TF_STATE_BUCKET}"
        echo "TF_STATE_PREFIX=${_TF_STATE_PREFIX}"
        echo "RUNTIME_PROJECT_ID=${_RUNTIME_PROJECT_ID}"
        echo "BUILD_PROJECT_ID=${_BUILD_PROJECT_ID}"
        echo "BUILDER_SA_EMAIL=${_BUILDER_SA_EMAIL}"
        echo "RUNTIME_SA_EMAIL=${_RUNTIME_SA_EMAIL}"
        echo "ORCH_PROJECT_ID=${_ORCH_PROJECT_ID}"
        echo "AR_REPO=${_AR_REPO}"
        echo "BENCHMARK_ID=${_BENCHMARK_ID}"
        echo "BENCHMARK_BUCKET=${_BENCHMARK_BUCKET}"
        echo "CHUNK_SIZE=${_CHUNK_SIZE}"

  # 1. Dynamic Deployment Spec Rendering
  - id: k8s-render
    name: 'python:3.11-slim'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          echo "[INFO] Rendering dynamic K8s deployment manifests reading config.toml..."
          python3 infra-as-code/scripts/render_pod_spec.py --arch="${_ARCH}" --blocks="${_BLOCK_CONCURRENCY}" --image="${_IMAGE}" --radix="${_RADIX}" --benchmark-id="${_BENCHMARK_ID}"
        fi

  # 2. Clean GCS bucket before run to avoid stale proofs
  - id: clean-gcs
    name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          echo "[INFO] Cleaning GCS stark_proofs directory..."
          if [ -f gcs_prefix.txt ]; then
            GCS_PREFIX=$(cat gcs_prefix.txt)
            gsutil -m rm -rf "$${GCS_PREFIX}/stark_proofs/*" || true
          else
            echo "[WARNING] gcs_prefix.txt not found, skipping clean."
          fi
        fi

  # 3. Deploy GKE Proving Pipeline (Concurrent)
  - id: deploy-pipeline
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          PROJECT_ID="${_RUNTIME_PROJECT_ID:-${_BUILD_PROJECT_ID}}"
          gcloud container clusters get-credentials lighter-prover-cluster-${_ARCH} --zone=${_REGION}-b --project=$${PROJECT_ID}
          
          echo "[INFO] Cleaning old Jobs..."
          kubectl delete job/lighter-leaf-worker job/lighter-tree-aggregator job/lighter-coordinator --ignore-not-found=true --wait=false
          for i in {1..30}; do
            if ! kubectl get job/lighter-leaf-worker job/lighter-tree-aggregator job/lighter-coordinator &>/dev/null; then
              break
            fi
            echo "[INFO] Waiting for old jobs to be deleted..."
            sleep 2
          done
          
          echo "[INFO] Deploying Leaf Workers..."
          kubectl apply -f infra-as-code/kubernetes/prover_pod_unit-leaf.rendered.yaml
          
          echo "[INFO] Deploying Tree Aggregator..."
          kubectl apply -f infra-as-code/kubernetes/prover_pod_unit-tree.rendered.yaml
          
          echo "[INFO] Deploying Coordinator..."
          kubectl apply -f infra-as-code/kubernetes/prover_pod_unit-coordinator.rendered.yaml
          
          echo "[INFO] Waiting for pipeline completion (waiting on coordinator)..."
          kubectl wait --for=condition=complete job/lighter-coordinator --timeout=1200s
          
          echo "[INFO] Extracting coordinator logs from GCS..."
          GCS_PREFIX=$$(cat gcs_prefix.txt)
          gsutil cp "$${GCS_PREFIX}/coordinator.log" coordinator.log
        fi

  # 7. Extract GKE Telemetry & Upload bench_summary.json
  - id: gke-telemetry
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          PROJECT_ID="${_RUNTIME_PROJECT_ID:-${_BUILD_PROJECT_ID}}"
          gcloud container clusters get-credentials lighter-prover-cluster-${_ARCH} --zone=${_REGION}-b --project=$${PROJECT_ID}
          python3 infra-as-code/scripts/extract_gke_telemetry.py --arch="${_ARCH}" --coordinator-log=coordinator.log --config=config.toml
        fi

substitutions:
  _ENGINE: 'gke'
  _ARCH: 'c3d'
  _RADIX: '16'
  _CHUNK_SIZE: '1'
  _BLOCK_CONCURRENCY: '10'
  _REGION: 'us-east4'
  _BUILD_PROJECT_ID: ''
  _RUNTIME_PROJECT_ID: ''
  _BENCHMARK_ID: ''
  _IMAGE: 'latest'
  _BENCHMARK_BUCKET: ''
  _TF_ACTION: 'apply'
  _TF_STATE_BUCKET: ''
  _TF_STATE_PREFIX: ''
  _AR_REPO: ''
  _ORCH_PROJECT_ID: ''
  _BUILDER_SA_EMAIL: ''
  _RUNTIME_SA_EMAIL: ''

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s

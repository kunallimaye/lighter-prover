apiVersion: apps/v1
kind: Deployment
metadata:
  name: lighter-leaf-worker
  labels:
    app: zkp-prover
    role: leaf-worker
    silicon-arch: t2d
spec:
  replicas: 6
  selector:
    matchLabels:
      role: leaf-worker
  template:
    metadata:
      labels:
        role: leaf-worker
        silicon-arch: t2d
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
        cloud.google.com/compute-class: "t2d"
        kubernetes.io/arch: amd64
      containers:
      - name: prover
        image: us-docker.pkg.dev/kunal-scratch/lighter-prover-iac/zkp-prover:v0.0.3-distributed-proving
        command: ["prover-node", "leaf-worker", "--tx-per-proof", "2"]
        resources:
          limits:
            cpu: "30"
            memory: "120Gi"
          requests:
            cpu: "30"
            memory: "120Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lighter-tree-aggregator
  labels:
    app: zkp-prover
    role: tree-node
    silicon-arch: t2d
spec:
  replicas: 2
  selector:
    matchLabels:
      role: tree-node
  template:
    metadata:
      labels:
        role: tree-node
        silicon-arch: t2d
    spec:
      nodeSelector:
        cloud.google.com/gke-spot: "true"
        cloud.google.com/compute-class: "t2d"
        kubernetes.io/arch: amd64
      containers:
      - name: aggregator
        image: us-docker.pkg.dev/kunal-scratch/lighter-prover-iac/zkp-prover:v0.0.3-distributed-proving
        command: ["prover-node", "tree-node"]
        resources:
          limits:
            cpu: "16"
            memory: "32Gi"
          requests:
            cpu: "16"
            memory: "32Gi"

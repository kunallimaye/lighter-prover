steps:
  # 1. Initialize Docker Buildx multi-architecture builder
  - id: setup-buildx
    name: 'gcr.io/cloud-builders/docker'
    args: ['buildx', 'create', '--use', '--name', 'multiarch-builder']

  # 2. Compile and containerize dual-arch ZKP STARK daemon (amd64 znver3 + arm64 neoverse)
  - id: build-zkp-prover-multiarch
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'buildx'
      - 'build'
      - '--platform'
      - '${_PLATFORM}'
      - '--build-arg'
      - 'RUSTFLAGS=${_RUSTFLAGS}'
      - '--build-arg'
      - 'CARGO_FEATURES=${_CARGO_FEATURES}'
      - '-f'
      - '${_DOCKERFILE}'
      - '-t'
      - '${_IMAGE_URI}'
      - '-t'
      - '${_EXTRA_TAG_URI}'
      - '--push'
      - '.'

substitutions:
  _PLATFORM: 'linux/amd64'
  _DOCKERFILE: 'Dockerfile.zkp'
  _IMAGE_URI: 'zkp-prover:amd64'
  _EXTRA_TAG_URI: 'zkp-prover:latest'
  _RUSTFLAGS: '-C target-cpu=znver3'
  _CARGO_FEATURES: 'pubsub'

options:
  logging: CLOUD_LOGGING_ONLY

# Cloud Build pipeline for executing distributed proving benchmark cycles.
#
# Target Directory: infra-as-code/terraform
#
# This pipeline initializes remote GCS backend state, applies Terraform IaC for
# the bare GCE MIG engine, runs a distributed Plonky2 proving smoke pipeline
# (leaf -> tree -> root over a filesystem proof transport), and cleanly destroys
# hardware. The GKE engine is not provisioned and fails fast (see
# docs/decisions/ADR-distributed-gke-topology.md).

steps:
  # 0. Noop to satisfy unused vars validation
  - id: noop-unused-vars
    name: 'alpine:latest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "Unused vars to satisfy Cloud Build validation:"
        echo "BLOCK_CONCURRENCY=${_BLOCK_CONCURRENCY}"
        echo "TF_ACTION=${_TF_ACTION}"
        echo "RADIX=${_RADIX}"
        echo "BENCHMARK_ID=${_BENCHMARK_ID}"
        echo "IMAGE=${_IMAGE}"
        echo "CHUNK_SIZE=${_CHUNK_SIZE}"

  # 1. Initialize Terraform backend
  - id: tf-init
    name: 'hashicorp/terraform:1.14'
    dir: 'infra-as-code/terraform'
    args:
      - 'init'
      - '-backend-config=bucket=${_TF_STATE_BUCKET}'
      - '-backend-config=prefix=${_TF_STATE_PREFIX}'
    env:
      - 'TF_IN_AUTOMATION=true'
  # 1.5 Diagnose IAM permission directly using Google API Client
  - id: diagnose-iam
    name: 'python:3.11-slim'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        pip install --no-cache-dir google-api-python-client google-auth >/dev/null 2>&1
        python3 -c '
        import sys
        try:
            from googleapiclient import discovery
            import google.auth
            from google.auth.transport.requests import Request
            credentials, project = google.auth.default()
            if hasattr(credentials, "refresh"):
                credentials.refresh(Request())
            if hasattr(credentials, "service_account_email"):
                print(f"[DIAGNOSTIC] Running as service account: {credentials.service_account_email}")
            else:
                print(f"[DIAGNOSTIC] Running as: {credentials}")
            service = discovery.build("iam", "v1", credentials=credentials)
            resource = "projects/kunal-scratch/serviceAccounts/lighter-runtime@kunal-scratch.iam.gserviceaccount.com"
            print(f"[DIAGNOSTIC] Attempting to get IAM policy for {resource} using API Client...")
            request = service.projects().serviceAccounts().getIamPolicy(resource=resource)
            policy = request.execute()
            print("[DIAGNOSTIC] SUCCESS (GET)!")
            print(policy)
            
            print(f"[DIAGNOSTIC] Attempting to set IAM policy (test setIamPolicy)...")
            # Set the same policy back to test permission
            set_request = service.projects().serviceAccounts().setIamPolicy(resource=resource, body={"policy": policy})
            set_policy = set_request.execute()
            print("[DIAGNOSTIC] SUCCESS (SET)!")
        except Exception as e:
            print("[DIAGNOSTIC] FAILED!", file=sys.stderr)
            print(e, file=sys.stderr)
        '

  # 2. Declarative Terraform Apply (Provision GKE / Spot MIGs)
  - id: tf-apply
    name: 'hashicorp/terraform:1.14'
    entrypoint: 'sh'
    dir: 'infra-as-code/terraform'
    args:
      - '-c'
      - |
        echo "[INFO] Executing Terraform action: ${_TF_ACTION} (engine=${_ENGINE}, arch=${_ARCH})..."
        terraform "${_TF_ACTION}" -auto-approve -no-color -input=false
    env:
      - 'TF_IN_AUTOMATION=true'
      - 'TF_VAR_enable_shared_resources=false'
      - 'TF_VAR_orchestration_project_id=${_ORCH_PROJECT_ID}'
      - 'TF_VAR_orchestration_region=${_REGION}'
      - 'TF_VAR_build_project_id=${_BUILD_PROJECT_ID}'
      - 'TF_VAR_build_region=${_REGION}'
      - 'TF_VAR_runtime_project_id=${_RUNTIME_PROJECT_ID}'
      - 'TF_VAR_runtime_region=${_REGION}'
      - 'TF_VAR_builder_sa_email=${_BUILDER_SA_EMAIL}'
      - 'TF_VAR_runtime_sa_email=${_RUNTIME_SA_EMAIL}'
      - 'TF_VAR_ar_repo=${_AR_REPO}'
      - 'TF_VAR_silicon_arch=${_ARCH}'
      - 'TF_VAR_orchestration_engine=${_ENGINE}'

  # 2.5 Dynamic Deployment Spec Rendering
  - id: k8s-render
    name: 'python:3.11-slim'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          echo "[INFO] Rendering dynamic K8s deployment manifests reading config.toml..."
          python3 infra-as-code/scripts/render_pod_spec.py --arch="${_ARCH}" --blocks="${_BLOCK_CONCURRENCY}" --image="${_IMAGE}" --radix="${_RADIX}"
        fi

  # 2.6 Clean GCS bucket before run to avoid stale proofs
  - id: clean-gcs
    name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          echo "[INFO] Cleaning GCS stark_proofs directory..."
          gsutil -m rm -rf "gs://${_TF_STATE_BUCKET}/stark_proofs/*" || true
        fi

  # 2.7 Deploy GKE Leaf Workers Job
  - id: deploy-leaves
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          PROJECT_ID="${_RUNTIME_PROJECT_ID:-${_BUILD_PROJECT_ID}}"
          gcloud container clusters get-credentials lighter-prover-cluster-${_ARCH} --zone=${_REGION}-b --project=$${PROJECT_ID}
          echo "[INFO] Deploying leaf workers Job to GKE..."
          kubectl delete job/lighter-leaf-worker --ignore-not-found=true
          kubectl apply -f infra-as-code/kubernetes/prover_pod_unit-leaf.rendered.yaml
          echo "[INFO] Waiting for leaf workers to complete..."
          kubectl wait --for=condition=complete job/lighter-leaf-worker --timeout=2400s
        fi

  # 2.8 Deploy GKE Tree Aggregator Job
  - id: deploy-tree
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          PROJECT_ID="${_RUNTIME_PROJECT_ID:-${_BUILD_PROJECT_ID}}"
          gcloud container clusters get-credentials lighter-prover-cluster-${_ARCH} --zone=${_REGION}-b --project=$${PROJECT_ID}
          echo "[INFO] Deploying tree aggregator Job to GKE..."
          kubectl delete job/lighter-tree-aggregator --ignore-not-found=true
          kubectl apply -f infra-as-code/kubernetes/prover_pod_unit-tree.rendered.yaml
          echo "[INFO] Waiting for tree aggregator to complete..."
          kubectl wait --for=condition=complete job/lighter-tree-aggregator --timeout=1200s
        fi

  # 2.9 Download GKE root proof for local coordinator verification
  - id: download-root-proof
    name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          echo "[INFO] Downloading root proof from GCS..."
          mkdir -p reports/stark_proofs
          gsutil cp "gs://${_TF_STATE_BUCKET}/stark_proofs/tree_L1_N0.proof" reports/stark_proofs/
        fi

  # 3. Execute Coordinator Verification
  - id: dist-prove
    name: 'rust:latest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        export SILICON_ARCH="${_ARCH}"
        export IMAGE="${_IMAGE}"
        export BLOCK_CONCURRENCY="${_BLOCK_CONCURRENCY}"
        if [ "${_ENGINE}" = "gke" ]; then
          echo "[INFO] Running GKE coordinator verification (chunk_size=${_CHUNK_SIZE})..."
          cargo run --release --bin prover-node -- root-coordinator --block-number 1042 --radix "${_RADIX}" --node-idx 0 --tx-per-proof 1
        else
          echo "[INFO] Running MIG local smoke pipeline (chunk_size=${_CHUNK_SIZE})..."
          cargo build --release --bin prover-node
          cargo run --release --bin prover-node -- leaf-worker --chunk-idx 0 --tx-per-proof 1
          cargo run --release --bin prover-node -- leaf-worker --chunk-idx 1 --tx-per-proof 1
          cargo run --release --bin prover-node -- tree-node --level 1 --node-idx 0 --radix "${_RADIX}" --tx-per-proof 1
          cargo run --release --bin prover-node -- root-coordinator --block-number 1042 --radix "${_RADIX}" --node-idx 0 --tx-per-proof 1
        fi

  # 3b. Upload the real distributed proof artifacts to GCS (only for MIG)
  - id: upload-reports
    name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" != "gke" ]; then
          echo "[DEBUG] Inspecting proof transport directory contents..."
          ls -la reports/stark_proofs/ || true
          if [ -d "reports/stark_proofs" ] && [ -n "${_TF_STATE_BUCKET:-}" ]; then
            TS=$(date +%Y%m%d-%H%M%S)
            DEST="distributed-proofs/${_BENCHMARK_ID}/${_IMAGE}/${_ENGINE}-${_ARCH}/blocks-${_BLOCK_CONCURRENCY}/$${TS}"
            echo "[INFO] Uploading aggregated proof artifacts to gs://${_TF_STATE_BUCKET}/$${DEST}/..."
            gsutil -m cp -r reports/stark_proofs/* "gs://${_TF_STATE_BUCKET}/$${DEST}/"
          fi
        fi

  # 4. Mandatory Post-Test Zero-Billing Teardown
  - id: tf-destroy
    name: 'hashicorp/terraform:1.14'
    entrypoint: 'sh'
    dir: 'infra-as-code/terraform'
    args:
      - '-c'
      - |
        # Tear down the fleet (GKE cluster or GCE MIGs) for zero-billing.
        terraform destroy -auto-approve -no-color -input=false
    env:
      - 'TF_IN_AUTOMATION=true'
      - 'TF_VAR_enable_shared_resources=false'
      - 'TF_VAR_orchestration_project_id=${_ORCH_PROJECT_ID}'
      - 'TF_VAR_orchestration_region=${_REGION}'
      - 'TF_VAR_build_project_id=${_BUILD_PROJECT_ID}'
      - 'TF_VAR_build_region=${_REGION}'
      - 'TF_VAR_runtime_project_id=${_RUNTIME_PROJECT_ID}'
      - 'TF_VAR_runtime_region=${_REGION}'
      - 'TF_VAR_builder_sa_email=${_BUILDER_SA_EMAIL}'
      - 'TF_VAR_runtime_sa_email=${_RUNTIME_SA_EMAIL}'
      - 'TF_VAR_ar_repo=${_AR_REPO}'
      - 'TF_VAR_silicon_arch=${_ARCH}'
      - 'TF_VAR_orchestration_engine=${_ENGINE}'

substitutions:
  # NOTE: GKE engine is not provisioned (see ADR-distributed-gke-topology.md);
  # the bare GCE MIG path is the working engine. ENGINE=gke fails fast in tf-apply.
  _ENGINE: 'mig'
  _ARCH: 'c3d'
  _RADIX: '2'
  _CHUNK_SIZE: '1'
  _TF_ACTION: 'apply'
  _BLOCK_CONCURRENCY: '2'
  _TF_STATE_BUCKET: ''
  _TF_STATE_PREFIX: 'lighter-prover-dist'
  _REGION: 'us-central1'
  _ORCH_PROJECT_ID: ''
  _BUILD_PROJECT_ID: ''
  _RUNTIME_PROJECT_ID: ''
  _BUILDER_SA_EMAIL: ''
  _RUNTIME_SA_EMAIL: ''
  _AR_REPO: 'lighter-prover'
  _BENCHMARK_ID: ''
  _IMAGE: 'default'

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 5400s

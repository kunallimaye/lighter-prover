# Cloud Build pipeline for executing distributed proving benchmark cycles.
#
# Target Directory: infra-as-code/terraform
#
# This pipeline initializes remote GCS backend state, applies Terraform IaC,
# executes unmocked distributed Plonky2 proving across Pub/Sub, and cleanly destroys hardware.

steps:
  # 1. Initialize Terraform backend
  - id: tf-init
    name: 'hashicorp/terraform:1.14'
    dir: 'infra-as-code/terraform'
    args:
      - 'init'
      - '-backend-config=bucket=${_TF_STATE_BUCKET}'
      - '-backend-config=prefix=${_TF_STATE_PREFIX}'
    env:
      - 'TF_IN_AUTOMATION=true'

  # 2. Declarative Terraform Apply (Provision GKE / Spot MIGs)
  - id: tf-apply
    name: 'hashicorp/terraform:1.14'
    entrypoint: 'sh'
    dir: 'infra-as-code/terraform'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" != "gke" ]; then
          echo "[INFO] Executing Terraform action: ${_TF_ACTION} (engine=${_ENGINE}, arch=${_ARCH})..."
          terraform "${_TF_ACTION}" -auto-approve -no-color -input=false
        else
          echo "[INFO] Engine is GKE: Skipping bare-metal GCE VM terraform apply..."
        fi
    env:
      - 'TF_IN_AUTOMATION=true'
      - 'TF_VAR_orchestration_project_id=${_ORCH_PROJECT_ID}'
      - 'TF_VAR_orchestration_region=${_REGION}'
      - 'TF_VAR_build_project_id=${_BUILD_PROJECT_ID}'
      - 'TF_VAR_build_region=${_REGION}'
      - 'TF_VAR_runtime_project_id=${_RUNTIME_PROJECT_ID}'
      - 'TF_VAR_runtime_region=${_REGION}'
      - 'TF_VAR_builder_sa_email=${_BUILDER_SA_EMAIL}'
      - 'TF_VAR_runtime_sa_email=${_RUNTIME_SA_EMAIL}'
      - 'TF_VAR_ar_repo=${_AR_REPO}'
      - 'TF_VAR_silicon_arch=${_ARCH}'
      - 'TF_VAR_orchestration_engine=${_ENGINE}'

  # 2.5 Dynamic Deployment Spec Rendering
  - id: k8s-render
    name: 'python:3.11-slim'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" = "gke" ]; then
          echo "[INFO] Rendering dynamic K8s deployment manifests reading config.toml..."
          python3 infra-as-code/scripts/render_pod_spec.py --arch="${_ARCH}" --blocks="${_BLOCK_CONCURRENCY}" --image="${_IMAGE}"
        fi

  # 3. Execute Authentic Unmocked Distributed Proving Assembly Line
  - id: dist-prove
    name: 'rust:latest'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        set -eu
        export SILICON_ARCH="${_ARCH}"
        export IMAGE="${_IMAGE}"
        echo "[INFO] Dispatched authentic unmocked distributed proving benchmark (engine=${_ENGINE}, arch=${_ARCH}, chunk=${_CHUNK_SIZE}, bench_id=${_BENCHMARK_ID}, image=${_IMAGE})..."
        cargo run --release --bin prover-node -- root-coordinator --block-number 1042

  # 3b. Upload Distributed Proving Telemetry Summary to GCS
  - id: upload-reports
    name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "[DEBUG] Inspecting reports directory contents..."
        ls -la reports/ || true
        ls -la reports/job_1/ || true
        echo "[DEBUG] Checking condition: _TF_STATE_BUCKET='${_TF_STATE_BUCKET}' _BENCHMARK_ID='${_BENCHMARK_ID}'"
        if [ -f "reports/job_1/bench_summary.json" ]; then
          echo "[DEBUG] bench_summary.json file check passed."
        else
          echo "[DEBUG] bench_summary.json file check FAILED."
        fi
        if [ -n "${_TF_STATE_BUCKET}" ]; then
          echo "[DEBUG] _TF_STATE_BUCKET check passed."
        else
          echo "[DEBUG] _TF_STATE_BUCKET check FAILED."
        fi
        if [ -f "reports/job_1/bench_summary.json" ] && [ -n "${_TF_STATE_BUCKET}" ]; then
          TS=$(date +%Y%m%d-%H%M%S)
          DEST="benchmark-reports/${_BENCHMARK_ID}/gke-${_ARCH}/gke-pod-1/$${TS}"
          echo "[INFO] Uploading GKE telemetry reports to gs://${_TF_STATE_BUCKET}/$${DEST}/..."
          gsutil -m cp -r reports/* "gs://${_TF_STATE_BUCKET}/$${DEST}/"
        fi

  # 4. Mandatory Post-Test Zero-Billing Teardown
  - id: tf-destroy
    name: 'hashicorp/terraform:1.14'
    entrypoint: 'sh'
    dir: 'infra-as-code/terraform'
    args:
      - '-c'
      - |
        if [ "${_ENGINE}" != "gke" ]; then
          terraform destroy -auto-approve -no-color -input=false
        else
          echo "[INFO] Engine is GKE: Skipping bare-metal GCE VM terraform destroy..."
        fi
    env:
      - 'TF_IN_AUTOMATION=true'
      - 'TF_VAR_orchestration_project_id=${_ORCH_PROJECT_ID}'
      - 'TF_VAR_orchestration_region=${_REGION}'
      - 'TF_VAR_build_project_id=${_BUILD_PROJECT_ID}'
      - 'TF_VAR_build_region=${_REGION}'
      - 'TF_VAR_runtime_project_id=${_RUNTIME_PROJECT_ID}'
      - 'TF_VAR_runtime_region=${_REGION}'
      - 'TF_VAR_builder_sa_email=${_BUILDER_SA_EMAIL}'
      - 'TF_VAR_runtime_sa_email=${_RUNTIME_SA_EMAIL}'
      - 'TF_VAR_ar_repo=${_AR_REPO}'
      - 'TF_VAR_silicon_arch=${_ARCH}'
      - 'TF_VAR_orchestration_engine=${_ENGINE}'

substitutions:
  _ENGINE: 'gke'
  _ARCH: 'c3d'
  _CHUNK_SIZE: '1'
  _TF_ACTION: 'apply'
  _BLOCK_CONCURRENCY: '2'
  _TF_STATE_BUCKET: ''
  _TF_STATE_PREFIX: 'lighter-prover-dist'
  _REGION: 'us-central1'
  _ORCH_PROJECT_ID: ''
  _BUILD_PROJECT_ID: ''
  _RUNTIME_PROJECT_ID: ''
  _BUILDER_SA_EMAIL: ''
  _RUNTIME_SA_EMAIL: ''
  _AR_REPO: 'lighter-prover'
  _BENCHMARK_ID: ''
  _IMAGE: 'default'

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s

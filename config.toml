# ─── Indivisible Proving Pod Taxonomy & Execution Profiles ─────────────
# Defines collaborative Proving Pod specs (Leaf Workers + Tree Aggregators).
# Symmetrically reused across GKE Standard node pools and bare GCE MIGs.

[proving_pod.defaults]
arch   = "c3d" # AMD Genoa Zen 4 AVX-512 Sharding Frontier
engine = "mig"

[proving_pod.c4a]
machine_family = "c4a"
image          = "debian-cloud/debian-12-arm64"

[proving_pod.c4a.leaf_worker]
machine_type    = "c4a-highcpu-16"
disk_type       = "hyperdisk-balanced"
disk_size_gb    = 100
chunk_size      = 32
cpu_requests    = "14"
memory_requests = "24Gi"

[proving_pod.c4a.aggregator]
machine_type    = "c4a-highcpu-16"
disk_type       = "hyperdisk-balanced"
disk_size_gb    = 50
cpu_requests    = "14"
memory_requests = "24Gi"

[proving_pod.c3d]
machine_family = "c3d"
image          = "debian-cloud/debian-12"

[proving_pod.c3d.leaf_worker]
machine_type    = "c3d-highcpu-60"
node_count      = 11
pods_per_node   = 8
disk_type       = "hyperdisk-balanced"
disk_size_gb    = 100
chunk_size      = 1
cpu_requests    = "7"
memory_requests = "4Gi"

[proving_pod.c3d.aggregator]
machine_type    = "c3d-highcpu-60"
node_count      = 0
pods_per_node   = 0
disk_type       = "hyperdisk-balanced"
disk_size_gb    = 100
cpu_requests    = "7"
memory_requests = "4Gi"


[proving_pod.t2d]
machine_family = "t2d"
image          = "debian-cloud/debian-12"

[proving_pod.t2d.leaf_worker]
machine_type    = "t2d-standard-16"
disk_type       = "pd-balanced"
disk_size_gb    = 100
chunk_size      = 32
cpu_requests    = "14"
memory_requests = "24Gi"

[proving_pod.t2d.aggregator]
machine_type    = "t2d-standard-16"
disk_type       = "pd-balanced"
disk_size_gb    = 50
cpu_requests    = "14"
memory_requests = "24Gi"

[proving_pod.c4d]
machine_family = "c4d"
image          = "debian-cloud/debian-12"

[proving_pod.c4d.leaf_worker]
machine_type    = "c4d-highcpu-64"
node_count      = 11
pods_per_node   = 8
disk_type       = "hyperdisk-balanced"
disk_size_gb    = 100
chunk_size      = 1
cpu_requests    = "7"
memory_requests = "4Gi"

[proving_pod.c4d.aggregator]
machine_type    = "c4d-highcpu-64"
node_count      = 0
pods_per_node   = 0
disk_type       = "hyperdisk-balanced"
disk_size_gb    = 100

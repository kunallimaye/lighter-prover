# GKE Autopilot SCALE STAND-UP + VALIDATE pipeline (issue #235; #229 Track 1).
#
# The SCALE sibling of cloudbuild-gke-smoke.yaml. Where the smoke pipeline
# applies smoke.tfvars and re-runs the full eviction + HPA-backlog acceptance
# theater, this one applies a PARAMETERIZED scale tier (_TFVARS, e.g.
# scale-0p2pct.tfvars) and confirms the tier CAME UP — the goal is "apply a
# real scale tier and confirm all three machine classes scheduled", not to
# re-prove the day-1 mitigation invariants (those are proven once in the smoke
# pipeline + are HARDWIRED in main.tf regardless of tier).
#
# Region defaults to us-east4 (issue #235 / docs/live-benchmark-results.md
# FINDING C: c4a stocked out across all us-central1 zones; us-east4 confirmed
# Axion capacity). The scale tier uses its OWN cluster name + TF state prefix
# so a scale run never clobbers the smoke state (per-tier state isolation,
# docs/live-benchmark-results.md:63-69).
#
# Runs as tf-service-account (owner) — passed via --service-account on submit —
# because the interactive agent SA lacks container.* perms. Same
# Cloud-Build-drives-Terraform idiom as cloudbuild-gke-smoke.yaml.
#
# Stages:
#   0. ensure the GCS state bucket exists (idempotent)
#   1. terraform init + apply the GKE module with ${_TFVARS}
#   2. ONE consolidated readiness step (kubeconfig persists within the step):
#      cluster up + all machine classes (cells + coordinator + fold-workers)
#      roll out / pods schedule.
#
# DELIBERATELY OMITTED vs the smoke pipeline (issue #235):
#   - the synthetic Pub/Sub-backlog HPA publish + watch loop: a hand-published
#     backlog is smoke-acceptance theater. On a real scale tier the HPA reacts
#     to REAL block-dispatch load, not 30 synthetic messages; re-running it here
#     would only add cost + flakiness. The HPA resource itself is still applied
#     by terraform and reported below.
#   - the forced-drain eviction probe: the day-1 mitigation invariants are
#     hardwired in main.tf (coordinator safe-to-evict=false + PDB) and proven
#     once in the smoke pipeline; they do not change per tier.
#
# Teardown is a SEPARATE pipeline (cloudbuild-gke-scale-teardown.yaml).

timeout: 3600s

substitutions:
  _PROJECT_ID: ''
  _REGION: 'us-east4'
  _TF_STATE_BUCKET: ''
  _TF_STATE_PREFIX: 'lighter-prover/gke-scale'
  _CLUSTER_NAME: 'lighter-prover-scale'
  _TFVARS: 'scale-0p2pct.tfvars'

steps:
  # ── 0. Ensure the TF state bucket exists ──────────────────────────
  - id: ensure-state-bucket
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        echo "Running as: $$(gcloud config get-value account)"
        if gcloud storage buckets describe "gs://${_TF_STATE_BUCKET}" >/dev/null 2>&1; then
          echo "State bucket gs://${_TF_STATE_BUCKET} already exists."
        else
          echo "Creating state bucket gs://${_TF_STATE_BUCKET} ..."
          gcloud storage buckets create "gs://${_TF_STATE_BUCKET}" \
            --project "${_PROJECT_ID}" --location "${_REGION}" \
            --uniform-bucket-level-access
        fi

  # ── 1. terraform init + apply (${_TFVARS}) ────────────────────────
  - id: tf-init
    name: 'hashicorp/terraform:1.14'
    dir: 'cicd/terraform/gke'
    args:
      - 'init'
      - '-backend-config=bucket=${_TF_STATE_BUCKET}'
      - '-backend-config=prefix=${_TF_STATE_PREFIX}'
    env: ['TF_IN_AUTOMATION=true']

  - id: tf-apply
    name: 'hashicorp/terraform:1.14'
    dir: 'cicd/terraform/gke'
    args:
      - 'apply'
      - '-auto-approve'
      - '-no-color'
      - '-input=false'
      - '-var-file=${_TFVARS}'
      - '-var=project_id=${_PROJECT_ID}'
      - '-var=region=${_REGION}'
      - '-var=cluster_name=${_CLUSTER_NAME}'
    env: ['TF_IN_AUTOMATION=true']

  # ── 2. Consolidated readiness check (kubeconfig persists here) ────
  # Use the full cloud-sdk image (has kubectl + the gke auth plugin).
  - id: validate
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: bash
    env:
      - 'USE_GKE_GCLOUD_AUTH_PLUGIN=True'
    args:
      - -c
      - |
        set -euo pipefail
        # Ensure kubectl + the GKE auth plugin are present (idempotent).
        command -v kubectl >/dev/null 2>&1 || gcloud components install kubectl --quiet
        command -v gke-gcloud-auth-plugin >/dev/null 2>&1 || gcloud components install gke-gcloud-auth-plugin --quiet
        kubectl version --client 2>/dev/null | head -1 || true

        echo "════════════ CLUSTER UP EVIDENCE (${_TFVARS}) ════════════"
        gcloud container clusters get-credentials "${_CLUSTER_NAME}" \
          --region "${_REGION}" --project "${_PROJECT_ID}"
        gcloud container clusters list --region "${_REGION}" \
          --filter="name=${_CLUSTER_NAME}" \
          --format="table(name,status,currentMasterVersion,autopilot.enabled)"
        kubectl get nodes -o wide || echo "(Autopilot nodes appear on demand as pods schedule)"

        echo "════════════ METRICS ADAPTER (external-metrics path) ════════════"
        kubectl apply -f https://raw.githubusercontent.com/GoogleCloudPlatform/k8s-stackdriver/master/custom-metrics-stackdriver-adapter/deploy/production/adapter_new_resource_model.yaml
        kubectl rollout status deployment/custom-metrics-stackdriver-adapter \
          -n custom-metrics --timeout=300s || kubectl get pods -n custom-metrics -o wide

        echo "════════════ ALL MACHINE CLASSES READY ════════════"
        # Cells + coordinator always; fold-workers when the tier enables them.
        # A scale tier MUST get all enabled classes scheduled (issue #235
        # acceptance: "a us-east4 scale tier can be applied + confirmed up").
        FAILED=0
        kubectl rollout status deployment/prover-cells --timeout=900s || FAILED=1
        kubectl rollout status deployment/prover-coordinator --timeout=900s || FAILED=1
        if kubectl get deployment/prover-fold-worker >/dev/null 2>&1; then
          kubectl rollout status deployment/prover-fold-worker --timeout=900s || FAILED=1
        else
          echo "(fold-worker pool not enabled in ${_TFVARS} — skipping its rollout check)"
        fi
        kubectl get deploy -l 'machine-class' -o wide
        kubectl get pods -o wide -l 'machine-class'

        echo "════════════ ZONE SPREAD EVIDENCE (issue #235 FINDING C) ════════════"
        # When enable_zone_spread=true (the scale tfvars), pods should land in
        # >1 zone. ScheduleAnyway means concentration is tolerated, so this is
        # INFORMATIONAL, not a gate — a single-zone landing during a partial
        # stockout is the design-permitted fallback, not a failure.
        kubectl get pods -l 'machine-class' \
          -o custom-columns='POD:.metadata.name,ZONE:.metadata.labels.topology\.kubernetes\.io/zone,NODE:.spec.nodeName' 2>/dev/null || true
        kubectl get nodes -o custom-columns='NODE:.metadata.name,ZONE:.metadata.labels.topology\.kubernetes\.io/zone' 2>/dev/null || true

        echo "════════════ HPA RESOURCE (applied; reacts to REAL load, not synthetic) ════════════"
        kubectl get hpa prover-backlog-hpa -o wide || kubectl get hpa || true

        echo "-- VERDICT --"
        if [ "$$FAILED" = "0" ]; then
          echo "✅ SCALE-TIER-UP: ${_TFVARS} applied; all enabled machine classes rolled out."
        else
          echo "❌ SCALE-TIER FAILED: a machine class did not roll out within the window."
          kubectl get pods -o wide -l 'machine-class' || true
          exit 1
        fi

        echo "════════════ SCALE APPLY COMPLETE (${_TFVARS}) ════════════"

options:
  logging: CLOUD_LOGGING_ONLY

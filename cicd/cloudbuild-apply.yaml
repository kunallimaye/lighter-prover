# Terraform apply pipeline (three-role topology, #141).
#
# Triggered by: scripts/cloud.sh::cloud_infra (`make cloud-infra`) or
# merge-to-main via a Cloud Build trigger.
#
# Runs terraform init + apply (or destroy) with auto-approve. Builder SA
# runs in the build project; for Phase 1 the only resource it provisions
# is the Artifact Registry repo + IAM grants in the same project (see
# cicd/terraform/main.tf).
#
# Variables are passed as TF_VAR_<name> env vars to terraform. The set
# below is intentionally small — Phase 1 doesn't need the runtime SA,
# Cloud Run service, or LB/DNS variables that an upstream scaffold would
# pass. When Phase 2 reintroduces those, this file grows back.
steps:
  - id: tf-init
    name: 'hashicorp/terraform:1.14'
    dir: 'cicd/terraform'
    args:
      - 'init'
      - '-backend-config=bucket=${_TF_STATE_BUCKET}'
      - '-backend-config=prefix=${_TF_STATE_PREFIX}'
    env:
      - 'TF_IN_AUTOMATION=true'

  - id: tf-action
    name: 'hashicorp/terraform:1.14'
    dir: 'cicd/terraform'
    args:
      - '${_TF_ACTION}'
      - '-auto-approve'
      - '-no-color'
      - '-input=false'
    env:
      - 'TF_IN_AUTOMATION=true'
      - 'TF_VAR_orchestration_project_id=${_ORCH_PROJECT_ID}'
      - 'TF_VAR_orchestration_region=${_REGION}'
      - 'TF_VAR_build_project_id=${_BUILD_PROJECT_ID}'
      - 'TF_VAR_build_region=${_REGION}'
      - 'TF_VAR_runtime_project_id=${_RUNTIME_PROJECT_ID}'
      - 'TF_VAR_runtime_region=${_REGION}'
      - 'TF_VAR_builder_sa_email=${_BUILDER_SA_EMAIL}'
      - 'TF_VAR_runtime_sa_email=${_RUNTIME_SA_EMAIL}'
      - 'TF_VAR_ar_repo=${_AR_REPO}'

substitutions:
  _TF_ACTION: 'apply'
  _TF_STATE_BUCKET: ''
  _TF_STATE_PREFIX: 'lighter-prover'
  _REGION: 'us-central1'
  _ORCH_PROJECT_ID: ''
  _BUILD_PROJECT_ID: ''
  _RUNTIME_PROJECT_ID: ''
  _BUILDER_SA_EMAIL: ''
  _RUNTIME_SA_EMAIL: ''
  _AR_REPO: 'lighter-prover'

options:
  logging: CLOUD_LOGGING_ONLY

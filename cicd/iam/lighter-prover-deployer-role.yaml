title: "lighter-prover Deployer"
# NOTE: GCP caps custom-role descriptions at 300 chars. `gcloud iam roles
# update --file=<this>` (scripts/cloud.sh::_step_create_custom_role) fails
# with INVALID_ARGUMENT if this string exceeds 300 — keep it short. The
# full rationale for each permission group lives in the comments below.
description: "Curated permissions for the lighter-prover agent SA (operator identity): Cloud Build, AR, GCS, logs, Cloud Run Jobs, GKE Autopilot + Pub/Sub lifecycle (cicd/terraform/gke), plus GKE Workload-Identity deployer perms (#231). Bound with 30-day expiry by scripts/cloud.sh::admin-cloud-init."
stage: GA
includedPermissions:
  # Artifact Registry — push/pull bench images (cloud-bench-build matrix,
  # fleet VMs pull the per-microarch variants).
  - artifactregistry.repositories.uploadArtifacts
  - artifactregistry.repositories.downloadArtifacts
  - artifactregistry.repositories.get
  - artifactregistry.repositories.list
  - artifactregistry.dockerimages.get
  - artifactregistry.dockerimages.list
  - artifactregistry.tags.create
  - artifactregistry.tags.update
  - artifactregistry.tags.list
  # Cloud Build — submit and monitor builds (cloud-bench-build,
  # cloud-infra). Builds execute as the builder SA via --service-account;
  # actAs on the builder SA is granted separately in step 7.
  - cloudbuild.builds.create
  - cloudbuild.builds.get
  - cloudbuild.builds.list
  # Cloud Run — Phase 1 ships no long-lived service, but
  # cicd/cloudbuild.yaml documents Cloud Run Jobs as the future one-shot
  # runtime (gcloud run jobs create/execute), and cloud-app-* verbs return
  # in Phase 2 (#3). Services + Jobs perms kept so the role doesn't need
  # an Owner round-trip when Phase 2 lands.
  - run.services.create
  - run.services.update
  - run.services.delete
  - run.services.get
  - run.services.list
  - run.services.getIamPolicy
  - run.revisions.get
  - run.revisions.list
  - run.jobs.create
  - run.jobs.update
  - run.jobs.delete
  - run.jobs.get
  - run.jobs.list
  - run.jobs.run
  - run.executions.get
  - run.executions.list
  - run.operations.get
  # IAM Service Accounts — read + actAs only. SA lifecycle (create/delete)
  # is Owner-tier work done by admin-cloud-init, and the builder SA holds
  # serviceAccountAdmin for Terraform-managed SAs. The agent never needs
  # to mint or rewire identities — trimmed from the scaffold default to
  # reduce privilege-escalation surface.
  - iam.serviceAccounts.get
  - iam.serviceAccounts.list
  - iam.serviceAccounts.actAs
  - iam.serviceAccounts.getIamPolicy
  # GCS — TF state bucket, Cloud Build staging bucket, and the bench-fleet
  # results bucket (read results, write probes, clean up run prefixes).
  # buckets.setIamPolicy intentionally omitted: bucket IAM grants are
  # Owner-tier (admin-cloud-init fleet steps 11-12).
  - storage.buckets.get
  - storage.buckets.list
  - storage.buckets.getIamPolicy
  - storage.objects.create
  - storage.objects.delete
  - storage.objects.get
  - storage.objects.list
  - storage.objects.update
  # Logging — inspect Cloud Build / fleet / future Cloud Run Jobs logs.
  - logging.logEntries.list
  - logging.logs.list
  # Project metadata — read-only visibility for diagnostics
  # (cloud-preflight reads the runtime project IAM policy).
  - resourcemanager.projects.get
  - resourcemanager.projects.getIamPolicy
  # GKE (container.*) — stand up + tear down the GKE Autopilot cluster
  # that runs the distributed prover (cicd/terraform/gke, PR #154). The
  # terraform creates a single google_container_cluster with
  # enable_autopilot=true, then applies workloads (Deployments, PDB, HPA)
  # through the kubernetes provider against the cluster's kube-apiserver.
  # Enumerated lifecycle: create/get/list/update/delete the cluster,
  # fetch credentials for kubeconfig (clusters.getCredentials), and
  # poll the long-running create/delete operations. Node pools are
  # included for completeness even though Autopilot manages nodes itself
  # (Google's Autopilot service agent provisions the underlying Compute —
  # see the compute note below) — the verbs are harmless and future-proof
  # a Standard-mode cluster.
  #
  # CAVEAT (honesty): this is a best-effort enumeration of the GKE
  # control-plane surface for an Autopilot cluster + node-pool +
  # workload + HPA apply/destroy. It is NOT guaranteed exhaustive for
  # every terraform/kubernetes-provider code path. If `terraform apply`
  # or `destroy` 403s on a container.* verb not listed here, the safe
  # fallback is to grant the predefined roles/container.admin to the
  # agent SA (bind it in scripts/cloud.sh alongside the custom role)
  # rather than chasing individual permissions — roles/container.admin
  # is the superset this block approximates.
  - container.clusters.create
  - container.clusters.get
  - container.clusters.getCredentials
  - container.clusters.list
  - container.clusters.update
  - container.clusters.delete
  - container.operations.get
  - container.operations.list
  # In-cluster object access used by the kubernetes provider (Deployments,
  # PDB, HPA, namespaces, the Workload-Identity KSA binding) once
  # kubeconfig is in hand. GKE maps these container.* verbs to the
  # apiserver RBAC for the caller identity.
  - container.deployments.create
  - container.deployments.get
  - container.deployments.list
  - container.deployments.update
  - container.deployments.delete
  - container.horizontalPodAutoscalers.create
  - container.horizontalPodAutoscalers.get
  - container.horizontalPodAutoscalers.list
  - container.horizontalPodAutoscalers.update
  - container.horizontalPodAutoscalers.delete
  - container.podDisruptionBudgets.create
  - container.podDisruptionBudgets.get
  - container.podDisruptionBudgets.list
  - container.podDisruptionBudgets.update
  - container.podDisruptionBudgets.delete
  - container.pods.get
  - container.pods.list
  - container.nodes.get
  - container.nodes.list
  - container.namespaces.get
  - container.namespaces.list
  - container.serviceAccounts.get
  - container.serviceAccounts.list
  # Pub/Sub (pubsub.*) — the block-dispatch backlog plane the autoscaler
  # consumes (cicd/terraform/gke/main.tf §2: google_pubsub_topic.dispatch
  # + google_pubsub_subscription.dispatch). The HPA scales on the
  # subscription's num_undelivered_messages. Enumerated lifecycle:
  # create/get/list/update/delete both topics and subscriptions, manage
  # their IAM policy (terraform may read/set it), and publish — the smoke
  # test hand-publishes messages to make the backlog climb on demand
  # (main.tf §6 comment).
  - pubsub.topics.create
  - pubsub.topics.get
  - pubsub.topics.list
  - pubsub.topics.update
  - pubsub.topics.delete
  - pubsub.topics.publish
  - pubsub.topics.getIamPolicy
  - pubsub.topics.setIamPolicy
  - pubsub.subscriptions.create
  - pubsub.subscriptions.get
  - pubsub.subscriptions.list
  - pubsub.subscriptions.update
  - pubsub.subscriptions.delete
  - pubsub.subscriptions.consume
  - pubsub.subscriptions.getIamPolicy
  - pubsub.subscriptions.setIamPolicy
  # ─── GKE Workload Identity + proof-store enablement (ref #231) ──────
  # The #231 WI work (PR #245) added three resources to cicd/terraform/gke
  # that the agent SA could not create with the permissions above:
  #
  #   * google_storage_bucket.proof_store (+ its bucket IAM member) — the
  #     shared GCS proof-store cells write L2 leaf proofs to and the
  #     coordinator reads/gcsfuse-mounts (issues #179, #206). The agent SA
  #     needs to create/delete the bucket and set its IAM policy. The
  #     curated-minimal stance previously omitted buckets.setIamPolicy as
  #     "Owner-tier" (see the GCS block above), but the GKE module now
  #     genuinely manages the proof-store bucket lifecycle end-to-end, so
  #     these verbs are enumerated here with that justification.
  #
  #   * google_project_iam_member.adapter_monitoring_viewer — binds the
  #     custom-metrics-stackdriver-adapter KSA to roles/monitoring.viewer
  #     at the PROJECT level (main.tf §3). Creating a project IAM member
  #     requires resourcemanager.projects.setIamPolicy.
  #
  # Bucket lifecycle (proof-store, GAP B):
  - storage.buckets.create
  - storage.buckets.delete
  - storage.buckets.setIamPolicy
  #
  # CAVEAT (privilege escalation — read before adding more): the next
  # permission is PROJECT-WIDE setIamPolicy. It is intentionally broad:
  # whoever holds it can grant themselves (or anyone) any role on the
  # project. We add it ONLY because google_project_iam_member.
  # adapter_monitoring_viewer (the metrics adapter's monitoring.viewer
  # binding, main.tf §3) cannot be created without it, and the metrics
  # adapter is required for the HPA to scale on Pub/Sub backlog (#231).
  # Mitigations: (1) this role is bound to the agent SA with a 30-day
  # EXPIRY condition (scripts/cloud.sh::_step_create_agent_sa_and_bind),
  # so the escalation surface is time-boxed and forces re-bootstrap; and
  # (2) admin-cloud-init is ALREADY an Owner-tier flow. REVISIT this if
  # the adapter binding is ever moved out-of-band (e.g. applied by the
  # Owner directly, or count-gated off in terraform) — at which point
  # this project-wide grant should be removed to restore least-privilege.
  - resourcemanager.projects.setIamPolicy
  #
  # GAP A is deliberately NOT here. The WI binding itself
  # (google_service_account_iam_member.prover_wi) needs
  # iam.serviceAccounts.setIamPolicy on the TARGET pod GSA
  # (lighter-prover-pods@<project>.iam.gserviceaccount.com), NOT on this
  # project. Granting that project-wide would let the agent rewrite the
  # IAM of every SA in the project. Instead it is granted RESOURCE-SCOPED
  # to the pod GSA only, via roles/iam.serviceAccountAdmin bound on that
  # one SA resource in scripts/cloud.sh::_step_grant_agent_wi_binding_on_pod_gsa.
  # That is strictly least-privilege; keep it out of this curated role.
# NOTE on compute.*: this role DELIBERATELY remains free of compute.*
# permissions, preserving the original curated-minimal stance. The GKE
# deployment uses Autopilot (cicd/terraform/gke/main.tf §1:
# enable_autopilot=true), where Google's managed Autopilot service agent
# — NOT the agent SA — provisions and networks the underlying Compute
# nodes. The agent SA therefore needs only the container.* control-plane
# verbs above, never compute.* directly. (The bench-fleet toolkit, which
# DOES touch Compute VMs, still runs as the separate FLEET_ORCHESTRATOR_SA
# — see scripts/cloud.sh fleet steps.)
#
# IF a future GKE Standard cluster with self-managed node pools is
# introduced, the caller WOULD need compute networking permissions. In
# that case do NOT inflate this curated role: bind the predefined
# roles/compute.admin to the agent SA in scripts/cloud.sh (the
# admin-cloud-init GKE/Pub-Sub step) so the curated-minimal discipline of
# this file is preserved. As of #167 (Autopilot only) that binding is
# unnecessary and is intentionally NOT added.
#
# Custom role ID used when this YAML is fed to gcloud iam roles
# create/update (scripts/common.sh): lighterProverDeployer

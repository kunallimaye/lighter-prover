# Cloud Build pipeline — Lighter bench container (Phase 1, multi-arch).
#
# Builds cicd/Containerfile against the source tree from the build
# context (i.e. *this* repo at the commit being built), then pushes a
# **multi-arch (linux/amd64 + linux/arm64) image manifest** to Artifact
# Registry tagged with :latest, :sha-${SHORT_SHA}, and :ref-${SHORT_SHA}.
#
# Multi-arch rationale (issue #29):
#   Issue #4's fleet baseline targets 10 GCP machine shapes; 8 of them
#   are ARM (Axion c4a/n4a, Ampere t2a). The classic
#   `docker build && docker push` flow on Cloud Build's default amd64
#   worker produced an amd64-only manifest that crashed every ARM VM
#   with `exec format error`. This pipeline uses `docker buildx` +
#   QEMU emulation so a single build run produces a manifest covering
#   both architectures, and consumers pull the same `:ref-<sha>` tag
#   regardless of node arch.
#
# Trade-offs:
#   * Build wall time grows ~3-5x (the arm64 build runs under QEMU on
#     an x86 worker). On E2_HIGHCPU_32 expect ~30-60 min for the full
#     two-arch Rust nightly compile vs ~10-15 min single-arch. The
#     `timeout` below is raised to 90 min to absorb the variance.
#   * Image size in the registry roughly doubles (both arch layer
#     stacks ship behind the same manifest).
#
# Both costs are accepted because the alternative (8 of 10 target VMs
# failing to start) is not viable.
#
# LIGHTER_REF semantic: the git SHA of this repo's commit being built,
# which IS the source baked into the image (no separate checkout
# happens — `COPY . .` in the Containerfile pulls from the build
# context). Derived from Cloud Build's built-in $COMMIT_SHA.
#
# Triggering paths:
#   - Recommended (operator workstation): `make cloud-bench-build`.
#     scripts/cloud.sh::cloud_bench_build derives the commit SHA from
#     `git rev-parse HEAD` and passes COMMIT_SHA / SHORT_SHA explicitly
#     via --substitutions (manual `gcloud builds submit` does NOT
#     auto-populate the built-ins — those only fire on git triggers).
#     Optionally override _TARGET_CPU_NATIVE=1 to compile with
#     -C target-cpu=native (non-portable image).
#   - Cloud Build trigger on git push: $COMMIT_SHA and $SHORT_SHA are
#     auto-populated by Cloud Build from the triggering commit.
#
# Three-role topology (see AGENTS.local.md / ADR-0001):
#   * orchestration = operator workstation submits the build
#   * build         = ${PROJECT_ID} (this Cloud Build project) compiles + pushes
#   * runtime       = Cloud Run Jobs in a (possibly different) project pulls + executes
#
# Tier-2 detached orchestration: scripts/cloud.sh::cloud_app_deploy
# submits this config in the background, writes a heartbeat, and the
# operator can re-check status via `make cloud-status`.

steps:
  # ─── 1. Register QEMU + create a buildx builder ─────────────────────
  #
  # `tonistiigi/binfmt --install all` registers binfmt_misc handlers
  # for every cross-arch combo so the docker daemon can execute
  # foreign-arch ELF binaries during the build. It needs --privileged
  # to mount the binfmt_misc filesystem; Cloud Build's default worker
  # supports this.
  #
  # `docker buildx create --driver docker-container` spins up a
  # buildkit container as the builder backend — required because the
  # default `docker` driver cannot produce multi-arch manifests (those
  # need buildkit's manifest-list support).
  - id: setup-buildx
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        docker run --privileged --rm tonistiigi/binfmt --install all
        docker buildx create --use --name lighter-builder --driver docker-container
        docker buildx inspect --bootstrap

  # ─── 2. Build + push the multi-arch image ───────────────────────────
  #
  # `--push` is mandatory for multi-arch: buildx cannot `--load` a
  # manifest list into the local daemon (no such concept), so the
  # registry IS the only place a multi-arch image can land. That's
  # also why we drop the top-level `images:` block below — buildx
  # already pushed by the time this step exits, and re-pushing via
  # the `images:` declaration would collapse the manifest list back
  # to single-arch.
  #
  # All three tags (:latest, :sha-<sha>, :ref-<sha>) point at the
  # same manifest list; consumers continue to pull by tag and the
  # registry resolves to the right per-arch image automatically.
  - id: build-and-push-multiarch
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        docker buildx build \
          --platform=linux/amd64,linux/arm64 \
          -f cicd/Containerfile \
          --build-arg LIGHTER_REF=${COMMIT_SHA} \
          --build-arg TARGET_CPU_NATIVE=${_TARGET_CPU_NATIVE} \
          -t ${_IMAGE_NAME}:latest \
          -t ${_IMAGE_NAME}:sha-${SHORT_SHA} \
          -t ${_IMAGE_NAME}:ref-${SHORT_SHA} \
          --push \
          .

# NOTE: no top-level `images:` block. buildx --push above already
# delivered a multi-arch manifest list to Artifact Registry. Adding an
# `images:` declaration would make Cloud Build re-resolve and re-push
# those tags via the classic `docker push` path, which only handles
# single-arch manifests and would collapse the multi-arch manifest
# list — silently breaking ARM consumers again. See issue #29.

substitutions:
  # Artifact Registry image URI. Default matches the runtime-project AR
  # repo provisioned by cicd/terraform. Override via --substitutions for
  # promotion / cross-project pushes.
  _IMAGE_NAME: 'us-central1-docker.pkg.dev/${PROJECT_ID}/lighter-prover/bench'

  # Toggle -C target-cpu=native. Default 0 (portable image). Set to 1
  # only when building for a known fleet of identical CPU models.
  # Note: target-cpu=native is meaningless for the cross-arch (arm64)
  # build under QEMU — the emulated CPU is generic. Use with care.
  _TARGET_CPU_NATIVE: '0'

  # $COMMIT_SHA and $SHORT_SHA are Cloud Build built-ins, auto-populated
  # from the triggering commit (or `--source` revision for manual
  # `gcloud builds submit`). They are NOT user substitutions — no
  # underscore prefix, no default needed; a missing value fails the
  # build LOUDLY instead of silently tagging :sha-unknown.

options:
  # Required when the build's service account doesn't have a
  # default-logging bucket bound. CLOUD_LOGGING_ONLY is the right choice
  # for projects without a dedicated GCS log bucket.
  logging: CLOUD_LOGGING_ONLY

  # The bench compile is CPU-bound and benefits from a meatier worker.
  # E2_HIGHCPU_32 is the right knee for the Rust nightly toolchain. The
  # arm64 cross-build runs under QEMU and is single-threaded-ish per
  # cargo job, so wider cores still help amortize parallel cargo work.
  machineType: 'E2_HIGHCPU_32'

# 90 min hard cap. Multi-arch Rust nightly compile (amd64 + arm64 under
# QEMU emulation) typically lands at 30-60 min on E2_HIGHCPU_32; the
# 90 min headroom protects against runaway downloads / DNS issues /
# network blips and Rust's occasional "let me just rebuild the world"
# moments.
timeout: '5400s'

# Cloud Build pipeline — Lighter bench container matrix (#33).
#
# One submit produces FOUR artifacts, all pushed to ${_IMAGE_NAME}:
#
#   :<sha> + :latest        portable multi-arch manifest list
#                           (amd64 default codegen + aarch64 cross-
#                           compiled). For dev / local-test / Cloud Run.
#   :<sha>-znver5           amd64,  -C target-cpu=znver5      (c4d/n4d AMD Turin)
#   :<sha>-neoverse-v2      arm64,  -C target-cpu=neoverse-v2 (c4a/n4a Google Axion)
#   :<sha>-neoverse-n1      arm64,  -C target-cpu=neoverse-n1 (t2a Ampere Altra)
#
# Cross-compilation rationale (#33, supersedes the #29/#30 QEMU build):
#   Cloud Build has NO ARM workers (verified June 2026: default pool is
#   e2/n1 x86 only; private pools are e2/n2d/c3 x86 only). The previous
#   pipeline ran the entire arm64 Rust compile under QEMU emulation
#   (~3-5× wall-time). The builder stage in cicd/Containerfile now runs
#   NATIVELY on the x86 worker for every artifact and cross-compiles
#   aarch64 output (rustup target + gcc-aarch64-linux-gnu linker). QEMU
#   is only used for the trivial arm64 runtime stage (apt installs,
#   minutes), whose layers are cached and shared across all arm64
#   variants within the buildx builder.
#
# Per-microarch honesty: the fleet benchmarks (scripts/bench-fleet)
# previously compiled with -C target-cpu=native ON each VM. With
# prebuilt images, "native" is meaningless — instead each of the 10 GCE
# shapes maps to one of 3 explicit microarch tags (machines.tsv
# image_tag column). Same codegen guarantee, no on-VM builds.
#
# LIGHTER_REF semantic: the git SHA of this repo's commit being built,
# which IS the source baked into the image (COPY . . from the build
# context). Derived from Cloud Build's built-in $COMMIT_SHA. Manual
# `gcloud builds submit` must pass COMMIT_SHA explicitly via
# --substitutions (built-ins only auto-populate on git triggers) —
# scripts/cloud.sh::cloud_bench_build does this.
#
# Three-role topology (ADR-0001-container-topology): all three roles
# collapse onto kunal-scratch (config.toml [gcp.defaults]).

steps:
  # ─── 1. Register QEMU + create a buildx builder ─────────────────────
  #
  # QEMU/binfmt is still required — NOT for rustc (cross-compiled), but
  # for the arm64 runtime stage's apt layer and for buildx to assemble
  # multi-arch manifests. docker-container driver is required for
  # manifest-list output.
  - id: setup-buildx
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        docker run --privileged --rm tonistiigi/binfmt --install all
        docker buildx create --use --name lighter-builder --driver docker-container
        docker buildx inspect --bootstrap

  # ─── 2. Portable multi-arch manifest (:<sha> + :latest) ────────────
  #
  # `--push` is mandatory for multi-arch (buildx cannot --load a
  # manifest list). No top-level `images:` block — re-pushing via the
  # classic path would collapse the manifest list (see #29).
  - id: build-portable-multiarch
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        docker buildx build \
          --builder lighter-builder \
          --platform=linux/amd64,linux/arm64 \
          -f cicd/Containerfile \
          --build-arg LIGHTER_REF=${COMMIT_SHA} \
          --build-arg TARGET_CPU=portable \
          --build-arg CARGO_FEATURES=native-pubsub \
          -t ${_IMAGE_NAME}:${COMMIT_SHA} \
          -t ${_IMAGE_NAME}:latest \
          --push \
          .

  # ─── 3-5. Per-microarch variants ────────────────────────────────────
  #
  # Sequential on purpose: each variant is a full recompile (RUSTFLAGS
  # changes invalidate every crate), and E2_HIGHCPU_32 is already
  # saturated by one cargo build. The arm64 runtime apt layers are
  # cached from step 2.
  - id: build-znver5
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        docker buildx build \
          --builder lighter-builder \
          --platform=linux/amd64 \
          -f cicd/Containerfile \
          --build-arg LIGHTER_REF=${COMMIT_SHA} \
          --build-arg TARGET_CPU=znver5 \
          --build-arg CARGO_FEATURES=native-pubsub \
          -t ${_IMAGE_NAME}:${COMMIT_SHA}-znver5 \
          --push \
          .

  - id: build-neoverse-v2
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        docker buildx build \
          --builder lighter-builder \
          --platform=linux/arm64 \
          -f cicd/Containerfile \
          --build-arg LIGHTER_REF=${COMMIT_SHA} \
          --build-arg TARGET_CPU=neoverse-v2 \
          --build-arg CARGO_FEATURES=native-pubsub \
          -t ${_IMAGE_NAME}:${COMMIT_SHA}-neoverse-v2 \
          --push \
          .

  - id: build-neoverse-n1
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        docker buildx build \
          --builder lighter-builder \
          --platform=linux/arm64 \
          -f cicd/Containerfile \
          --build-arg LIGHTER_REF=${COMMIT_SHA} \
          --build-arg TARGET_CPU=neoverse-n1 \
          --build-arg CARGO_FEATURES=native-pubsub \
          -t ${_IMAGE_NAME}:${COMMIT_SHA}-neoverse-n1 \
          --push \
          .

  # ─── 6. Verify binary architecture of every artifact ───────────────
  #
  # Belt-and-suspenders on top of the in-Containerfile file(1) assert:
  # pull each pushed tag (per platform), extract /app/bench WITHOUT
  # running it (docker create + docker cp — no QEMU execution), and
  # fail the build on any ELF-arch mismatch. This is the contract that
  # prevents a repeat of the pre-#30 "exec format error" fleet wipeout.
  - id: verify-binary-arch
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - -c
      - |
        set -euxo pipefail
        command -v file >/dev/null || { apt-get update -qq && apt-get install -y -qq file; }
        check() {
          local tag="$1" platform="$2" pattern="$3"
          local ref="${_IMAGE_NAME}:$${tag}"
          docker pull --platform "$${platform}" "$${ref}"
          local cid
          cid="$(docker create --platform "$${platform}" "$${ref}")"
          docker cp "$${cid}:/app/bench" /tmp/bench-check
          docker rm "$${cid}"
          file /tmp/bench-check
          file /tmp/bench-check | grep -q "$${pattern}" \
            || { echo "FATAL: $${ref} ($${platform}) bench binary is not $${pattern}" >&2; exit 1; }
          rm -f /tmp/bench-check
        }
        check "${COMMIT_SHA}"             linux/amd64 'x86-64'
        check "${COMMIT_SHA}"             linux/arm64 'ARM aarch64'
        check "${COMMIT_SHA}-znver5"      linux/amd64 'x86-64'
        check "${COMMIT_SHA}-neoverse-v2" linux/arm64 'ARM aarch64'
        check "${COMMIT_SHA}-neoverse-n1" linux/arm64 'ARM aarch64'
        echo "ALL ARCH CHECKS PASSED"

# NOTE: no top-level `images:` block — buildx --push already delivered
# the manifests; re-pushing would collapse the multi-arch list (#29).

substitutions:
  # Artifact Registry image URI. Default targets the collapsed
  # kunal-scratch topology. Override via --substitutions for promotion.
  _IMAGE_NAME: 'us-central1-docker.pkg.dev/${PROJECT_ID}/lighter-prover/bench'

options:
  logging: CLOUD_LOGGING_ONLY
  # Required so the ${PROJECT_ID} reference inside the _IMAGE_NAME
  # substitution default expands (bash would otherwise see the literal
  # `${PROJECT_ID}` and die on `set -u`).
  dynamic_substitutions: true
  # CPU-bound Rust compiles × 5 full variants — the widest x86 worker
  # in the default pool is the right knee.
  machineType: 'E2_HIGHCPU_32'

# 3h hard cap: 5 native-speed compiles at ~10-15 min each (amd64 portable,
# arm64 portable, znver5, neoverse-v2, neoverse-n1) + one QEMU arm64 apt
# layer (~5-10 min, then cached) + pushes + verify. Typical ~60-90 min;
# headroom absorbs cold caches and registry/network variance.
timeout: '10800s'

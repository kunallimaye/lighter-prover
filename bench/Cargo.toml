[package]
name = "bench"
description = "Lighter Circuits Benchmarking"
version = "0.0.1"
authors = ["Lighter Team"]
edition.workspace = true
license.workspace = true

[lib]
name = "bench"
path = "src/lib.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "prover-node"
path = "src/bin/prover_node.rs"

[[bin]]
name = "lighter-coordinator"
path = "src/bin/coordinator.rs"
required-features = ["pubsub"]

[features]
default = ["parallel", "std"]
parallel = ["plonky2/parallel"]
std = ["plonky2/std"]
# Production work-transport backend (GCP Pub/Sub pull + GCS native-API atomic
# claim/commit). OFF by default so the default build, `cargo test -p bench`, and
# the LocalTransport dev/test path stay 100% cloud-free with no cloud
# dependencies compiled in. Enable with `cargo build --features pubsub` to wire
# the production `PubSubGcsTransport`. TLS is rustls (no OpenSSL/pkg-config
# system dependency). See `bench/src/transport/pubsub.rs`.
pubsub = ["dep:google-cloud-storage", "dep:google-cloud-pubsub", "dep:google-cloud-googleapis", "dep:tokio", "dep:redis", "dep:futures-util"]

[dependencies]
num = { workspace = true }
itertools = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
plonky2 = { workspace = true, default-features = true }
lazy_static = { workspace = true }
serde = { workspace = true }
rayon = { workspace = true }
serde_with = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
bincode = { workspace = true }
ff = { workspace = true }
hashbrown = { workspace = true }
clap = { workspace = true }
clap_derive = { workspace = true }
tiny-keccak =  { workspace = true }
paste = { workspace = true }
circuit = { path = "../circuit", default-features = true }
base64 = "0.21"
# gzip framing for the per-tx pre-state corpus READ path (issue #316). Moved
# from [dev-dependencies] to a production dependency because the corpus loader
# (`bench::prestate_store::load_prestate_corpus_from_path`) now runs in the
# `prover-node` leaf-proving path, not just in tests.
flate2 = "1.0"
# Graceful-shutdown signal handling for the fungible `prover-node work` dispatch
# loop (SIGTERM on KEDA scale-down / Spot preemption -> finish in-flight prove,
# ack, exit). Tiny, cloud-free, std-only crate; compiled in the DEFAULT build so
# the drain contract holds for both the local and pubsub transports. See
# `src/shutdown.rs`.
signal-hook = { version = "0.3", default-features = false }

# ── Production work-transport backend deps (behind the `pubsub` feature only) ──
# Maintained crates from the `google-cloud-rust` family. rustls-tls avoids the
# OpenSSL/pkg-config system dependency. These are NOT compiled in the default
# build; `dep:`-gated by the `pubsub` feature above.
google-cloud-storage = { version = "0.24", default-features = false, features = ["rustls-tls", "auth"], optional = true }
google-cloud-pubsub = { version = "0.30", default-features = false, features = ["rustls-tls", "auth"], optional = true }
google-cloud-googleapis = { version = "0.16", optional = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
redis = { version = "0.24", default-features = false, features = ["tokio-comp"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false }
num_cpus = { version = "1.14.0", default-features = false }
rand = { workspace = true, features = [
  "getrandom",
  "std",
], default-features = true }
serde_cbor = { version = "0.11.2" }
serde_json = { version = "1.0" }
structopt = { version = "0.3.26", default-features = false }
tynm = { version = "0.1.6", default-features = false }

[target.'cfg(not(target_env = "msvc"))'.dev-dependencies]
tikv-jemallocator = "0.6"
